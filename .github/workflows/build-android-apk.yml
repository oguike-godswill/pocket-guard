name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build PocketGuard Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Rename APK for easy download
        working-directory: ./mobile
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PocketGuard-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketGuard-Android-APK
          path: mobile/build/app/outputs/flutter-apk/PocketGuard-Android.apk
          retention-days: 30
